name: CI Build chek 

on:
  push:
    branches:["main"]
  pull_request:
    branches:["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 
 
    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses:docker/setup-buildx-action@v3 
      
      - name: Build My App Image 
        run:
         docker build ./app -t my-app:test 

      - name: Check Redis Image
        run: docker pull redis:alpine
