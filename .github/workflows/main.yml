name: CI Build Check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build My App Image
        run: |
          docker build ./app -t my-app:test
        
      - name: Check Redis Image
        run: docker pull redis:alpine
